[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-density"
version = "0.1.0"
description = "Exact optimizer for periodic Conway Life on finite tori"
requires-python = ">=3.10"
dependencies = ["z3-solver>=4.12,<5"]

[project.scripts]
life-density = "life_density.cli:main"

[tool.setuptools.packages.find]
include = ["life_density*"]

