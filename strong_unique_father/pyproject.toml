[project]
name = "strong-unique-father"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["python-sat>=1.8.dev13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
strong-unique-father = "strong_unique_father.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
